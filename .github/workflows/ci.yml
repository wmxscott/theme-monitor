name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Build
        run: swift build --configuration release
      - name: Test
        run: swift test
      - name: Smoke test
        run: |
          bin="$(swift build --configuration release --show-bin-path)/theme-monitor"
          "$bin" --version
          "$bin" --print | grep -Ex 'light|dark'
          trigger="$RUNNER_TEMP/trigger"
          "$bin" --file "$trigger" &
          pid=$!
          for _ in $(seq 20); do [ -s "$trigger" ] && break; sleep 0.25; done
          kill "$pid"
          grep -Ex 'light|dark' "$trigger"
